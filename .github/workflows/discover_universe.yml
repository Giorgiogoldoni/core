name: Discover ETF/ETP Universe

on:
  schedule:
    - cron: "0 5 1 * *"  # 1° del mese, 05:00 UTC
  workflow_dispatch: {}   # permette lancio manuale da GitHub

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run discovery script
        run: python scripts/discover_universe.py

      - name: Commit and push (con retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tickers_universe.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica all'universo, skip commit."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            git commit -m "Aggiorna universo ETF/ETP [skip ci]" && \
            git pull --rebase && git push && break || \
            { echo "Retry $i..."; sleep 5; }
          done
