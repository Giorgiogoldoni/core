name: RAPTOR Scan Nuove Partenze (mattina)

on:
  schedule:
    # 06:00 UTC (8:00 CEST) lun-ven — dopo l'aggiornamento serale di core (18:00 UTC del giorno prima)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan nuove partenze + invio email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python scan_nuove_partenze.py

      - name: Commit e push nuove_partenze.json
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@noreply.github.com"
          git add nuove_partenze.json
          git diff --staged --quiet || git commit -m "🟢 Nuove partenze $(date +'%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push
