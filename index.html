<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE — Universo ETF/ETP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --ink: #14181f;
    --ink-soft: #5b6472;
    --line: #e2e5ea;
    --line-strong: #c7ccd4;
    --accent: #1f4b3f;
    --accent-soft: #e7f0ec;
    --warn: #8a5a12;
    --warn-soft: #fbf0dd;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header .sub {
    color: var(--ink-soft);
    font-size: 13px;
  }
  .top-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button.action {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.action:hover { background: #f6f7f8; }
  button.action.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.action.primary:hover { background: #17392f; }
  button.action:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  button.action:disabled:hover { background: #fff; }

  .stats {
    display: flex;
    gap: 10px;
    padding: 18px 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .stat-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    min-width: 110px;
  }
  .stat-card .n {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
  }
  .stat-card .l {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .filters {
    display: flex;
    gap: 14px;
    padding: 16px 32px;
    flex-wrap: wrap;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    background: #fafbfc;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-group label {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .filter-group select, .filter-group input[type="text"] {
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #fff;
    min-width: 150px;
  }
  #search { min-width: 220px; }
  .filter-group.checks {
    flex-direction: row;
    gap: 12px;
    align-items: center;
  }
  .filter-group.checks label {
    text-transform: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--ink);
  }
  #reset-filters {
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 0;
  }

  .table-wrap {
    padding: 0 32px 32px;
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 16px;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--line-strong);
    padding: 8px 10px;
    position: sticky;
    top: 0;
    background: #fff;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--ink); }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafbfc; }
  td.isin, td.ticker { font-family: var(--mono); font-size: 12.5px; }
  td.name {
    white-space: normal;
    max-width: 340px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: capitalize;
  }
  .badge.equity { background: #e7f0ec; color: #1f4b3f; }
  .badge.bond { background: #e8eef7; color: #2a4a7c; }
  .badge.commodity { background: #f7efe0; color: #8a5a12; }
  .badge.crypto { background: #f3e8f7; color: #6a2a8c; }
  .badge.leva_short { background: #fbe6e6; color: #a12c2c; }

  .badge.signal-buy { background: #e2f3e6; color: #1a7a34; }
  .badge.signal-watchlist { background: #fbf0dd; color: #8a5a12; }
  .badge.signal-notrade { background: #eceef1; color: #5b6472; }
  .badge.signal-na { background: #f4f5f6; color: #9aa1ab; }

  td.score-cell { font-family: var(--mono); font-weight: 600; }

  .conf { font-size: 12px; }
  .conf.default_fallback { color: var(--warn); font-weight: 600; }
  .conf.keyword_match { color: var(--ink-soft); }

  .empty-state {
    padding: 60px 32px;
    text-align: center;
    color: var(--ink-soft);
  }

  footer {
    padding: 14px 32px;
    color: var(--ink-soft);
    font-size: 12px;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <h1>CORE — Universo ETF/ETP</h1>
  <div class="sub">Ricognizione strumenti Borsa Italiana (ETF Plus) · Xetra non ancora disponibile</div>
  <div class="top-actions">
    <button class="action primary" id="export-excel">Esporta Excel</button>
    <button class="action" id="rules-pdf" disabled title="In arrivo — nessun regolamento operativo ancora definito per questa pagina">Regole (PDF) — in arrivo</button>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="filters">
  <div class="filter-group">
    <label>Cerca</label>
    <input type="text" id="search" placeholder="ISIN, ticker o nome...">
  </div>
  <div class="filter-group">
    <label>Asset class</label>
    <select id="f-asset-class">
      <option value="">Tutte</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Tipo prodotto</label>
    <select id="f-product-type">
      <option value="">Tutti</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Distribuzione</label>
    <select id="f-distribution">
      <option value="">Tutte</option>
      <option value="accumulating">Accumulazione</option>
      <option value="distributing">Distribuzione</option>
      <option value="null">Non indicata</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Valuta</label>
    <select id="f-currency">
      <option value="">Tutte</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Piazza</label>
    <select id="f-exchange">
      <option value="">Tutte</option>
      <option value="Borsa Italiana">Borsa Italiana</option>
      <option value="Xetra">Xetra</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Segnale</label>
    <select id="f-signal">
      <option value="">Tutti</option>
      <option value="BUY">BUY</option>
      <option value="WATCHLIST">WATCHLIST</option>
      <option value="NO TRADE">NO TRADE</option>
      <option value="__NA__">Nessuno score</option>
    </select>
  </div>
  <div class="filter-group checks">
    <label><input type="checkbox" id="f-leva"> Solo a leva/short</label>
    <label><input type="checkbox" id="f-uncertain"> Solo da rivedere (default_fallback)</label>
  </div>
  <button id="reset-filters">Azzera filtri</button>
</div>

<div class="table-wrap">
  <table id="data-table">
    <thead>
      <tr>
        <th data-key="isin">ISIN</th>
        <th data-key="ticker_yf">Ticker</th>
        <th data-key="name">Nome</th>
        <th data-key="currency">Valuta</th>
        <th data-key="exchange">Piazza</th>
        <th data-key="asset_class">Asset class</th>
        <th data-key="is_leveraged">Leva</th>
        <th data-key="product_type">Tipo</th>
        <th data-key="distribution_policy">Distribuzione</th>
        <th data-key="asset_class_confidence">Confidence</th>
        <th data-key="close">Prezzo</th>
        <th data-key="score_operativo">Score</th>
        <th data-key="signal">Segnale</th>
        <th data-key="signal_date">Segnale dal</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none;">Nessuno strumento corrisponde ai filtri selezionati.</div>
</div>

<footer id="footer"></footer>

<script>
let allData = [];
let sortKey = null;
let sortDir = 1;

const els = {
  search: document.getElementById('search'),
  assetClass: document.getElementById('f-asset-class'),
  productType: document.getElementById('f-product-type'),
  distribution: document.getElementById('f-distribution'),
  currency: document.getElementById('f-currency'),
  exchange: document.getElementById('f-exchange'),
  signal: document.getElementById('f-signal'),
  leva: document.getElementById('f-leva'),
  uncertain: document.getElementById('f-uncertain'),
  tbody: document.getElementById('table-body'),
  stats: document.getElementById('stats'),
  footer: document.getElementById('footer'),
  emptyState: document.getElementById('empty-state'),
  table: document.getElementById('data-table'),
};

function populateSelect(select, values) {
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

function renderStats(rows) {
  const total = rows.length;
  const byClass = {};
  rows.forEach(r => { byClass[r.asset_class] = (byClass[r.asset_class] || 0) + 1; });
  const uncertain = rows.filter(r => r.asset_class_confidence === 'default_fallback').length;

  let html = `<div class="stat-card"><div class="n">${total}</div><div class="l">Totale</div></div>`;
  Object.entries(byClass).sort((a,b) => b[1]-a[1]).forEach(([k,v]) => {
    html += `<div class="stat-card"><div class="n">${v}</div><div class="l">${k}</div></div>`;
  });
  html += `<div class="stat-card"><div class="n">${uncertain}</div><div class="l">Da rivedere</div></div>`;
  els.stats.innerHTML = html;
}

function currentFilters() {
  return {
    search: els.search.value.trim().toLowerCase(),
    assetClass: els.assetClass.value,
    productType: els.productType.value,
    distribution: els.distribution.value,
    currency: els.currency.value,
    exchange: els.exchange.value,
    signal: els.signal.value,
    leva: els.leva.checked,
    uncertain: els.uncertain.checked,
  };
}

function filterRows(f) {
  return allData.filter(r => {
    if (f.search) {
      const hay = `${r.isin} ${r.ticker_yf} ${r.name}`.toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    if (f.assetClass && r.asset_class !== f.assetClass) return false;
    if (f.productType && r.product_type !== f.productType) return false;
    if (f.distribution) {
      const dp = r.distribution_policy || 'null';
      if (dp !== f.distribution) return false;
    }
    if (f.currency && r.currency !== f.currency) return false;
    if (f.exchange && r.exchange !== f.exchange) return false;
    if (f.signal) {
      if (f.signal === '__NA__') {
        if (r.signal) return false;
      } else if (r.signal !== f.signal) return false;
    }
    if (f.leva && !r.is_leveraged) return false;
    if (f.uncertain && r.asset_class_confidence !== 'default_fallback') return false;
    return true;
  });
}

function applyFilters() {
  const f = currentFilters();
  let rows = filterRows(f);

  if (sortKey) {
    rows.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (va === null || va === undefined) va = '';
      if (vb === null || vb === undefined) vb = '';
      if (typeof va === 'boolean') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return 1 * sortDir;
      return 0;
    });
  }

  renderTable(rows);
  renderStats(rows);
}

function signalBadgeClass(signal) {
  if (signal === 'BUY') return 'signal-buy';
  if (signal === 'WATCHLIST') return 'signal-watchlist';
  if (signal === 'NO TRADE') return 'signal-notrade';
  return 'signal-na';
}

function renderTable(rows) {
  if (rows.length === 0) {
    els.tbody.innerHTML = '';
    els.emptyState.style.display = 'block';
    els.table.style.display = 'none';
    return;
  }
  els.emptyState.style.display = 'none';
  els.table.style.display = '';

  const html = rows.map(r => `
    <tr>
      <td class="isin">${r.isin}</td>
      <td class="ticker">${r.ticker_yf}</td>
      <td class="name">${r.name}</td>
      <td>${r.currency}</td>
      <td>${r.exchange || '—'}</td>
      <td><span class="badge ${r.asset_class}">${r.asset_class.replace('_',' ')}</span></td>
      <td>${r.is_leveraged ? 'Sì' : '—'}</td>
      <td>${r.product_type || '—'}</td>
      <td>${r.distribution_policy || '—'}</td>
      <td class="conf ${r.asset_class_confidence}">${r.asset_class_confidence === 'default_fallback' ? 'da rivedere' : 'ok'}</td>
      <td>${r.close != null ? r.close.toFixed(2) : '—'}</td>
      <td class="score-cell">${r.score_operativo != null ? r.score_operativo : '—'}</td>
      <td>${r.signal ? `<span class="badge ${signalBadgeClass(r.signal)}">${r.signal}</span>` : '—'}</td>
      <td>${r.signal_date || '—'}</td>
    </tr>
  `).join('');
  els.tbody.innerHTML = html;
}

function exportExcel() {
  const f = currentFilters();
  const rows = filterRows(f);

  const data = rows.map(r => ({
    ISIN: r.isin,
    Ticker: r.ticker_yf,
    Nome: r.name,
    Valuta: r.currency,
    Piazza: r.exchange || '',
    'Asset class': r.asset_class,
    Leva: r.is_leveraged ? 'Sì' : 'No',
    'Tipo prodotto': r.product_type || '',
    Distribuzione: r.distribution_policy || '',
    Confidence: r.asset_class_confidence,
    Prezzo: r.close != null ? r.close : '',
    Score: r.score_operativo != null ? r.score_operativo : '',
    Segnale: r.signal || '',
    'Segnale dal': r.signal_date || '',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Universo');
  XLSX.writeFile(wb, 'core_universo_etf.xlsx');
}

function resetFilters() {
  els.search.value = '';
  els.assetClass.value = '';
  els.productType.value = '';
  els.distribution.value = '';
  els.currency.value = '';
  els.exchange.value = '';
  els.signal.value = '';
  els.leva.checked = false;
  els.uncertain.checked = false;
  applyFilters();
}

[els.search, els.assetClass, els.productType, els.distribution, els.currency, els.exchange, els.signal, els.leva, els.uncertain]
  .forEach(el => el.addEventListener('input', applyFilters));

document.getElementById('reset-filters').addEventListener('click', resetFilters);
document.getElementById('export-excel').addEventListener('click', exportExcel);

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    applyFilters();
  });
});

async function loadData() {
  try {
    const res = await fetch('data/tickers_universe.json');
    const json = await res.json();
    allData = json.instruments || [];

    // Piazza di negoziazione derivata dal suffisso ticker Yahoo Finance
    allData = allData.map(r => ({
      ...r,
      exchange: r.ticker_yf && r.ticker_yf.endsWith('.MI') ? 'Borsa Italiana'
              : r.ticker_yf && r.ticker_yf.endsWith('.DE') ? 'Xetra'
              : null,
    }));

    populateSelect(els.assetClass, [...new Set(allData.map(r => r.asset_class))].sort());
    populateSelect(els.productType, [...new Set(allData.map(r => r.product_type).filter(Boolean))].sort());
    populateSelect(els.currency, [...new Set(allData.map(r => r.currency))].sort());

    let footerText = `Universo generato il ${new Date(json.generated_at).toLocaleString('it-IT')} · ${json.count} strumenti totali`;

    // etf_scores.json è generato da calculate_scores.py via GitHub Actions.
    // Se non esiste ancora (Action mai lanciata) la pagina resta comunque
    // utilizzabile in sola ricognizione, senza Score/Segnale.
    try {
      const scoresRes = await fetch('data/etf_scores.json');
      if (scoresRes.ok) {
        const scoresJson = await scoresRes.json();
        const scoresByIsin = {};
        (scoresJson.scores || []).forEach(s => { scoresByIsin[s.isin] = s; });

        let matched = 0;
        allData = allData.map(r => {
          const s = scoresByIsin[r.isin];
          if (!s) return r;
          matched++;
          return {
            ...r,
            close: s.close,
            score_operativo: s.score_operativo,
            score_vento: s.score_vento,
            score_onda: s.score_onda,
            signal: s.signal,
            signal_date: s.signal_date,
            sar_age: s.sar_age,
            adx: s.adx,
          };
        });

        footerText += ` · Score calcolati il ${new Date(scoresJson.generated_at).toLocaleString('it-IT')} (${matched}/${scoresJson.count} strumenti con score)`;
      } else {
        footerText += ' · Score non ancora disponibili — lancia manualmente il workflow "Aggiorna Universo e Calcola Score" da GitHub Actions.';
      }
    } catch (scoresErr) {
      footerText += ' · Score non ancora disponibili — lancia manualmente il workflow "Aggiorna Universo e Calcola Score" da GitHub Actions.';
    }

    els.footer.textContent = footerText;
    applyFilters();
  } catch (err) {
    els.footer.textContent = 'Errore nel caricamento di data/tickers_universe.json — verifica che il file esista nel repo.';
    els.emptyState.textContent = 'Impossibile caricare i dati.';
    els.emptyState.style.display = 'block';
    els.table.style.display = 'none';
  }
}

loadData();
</script>

</body>
</html>
